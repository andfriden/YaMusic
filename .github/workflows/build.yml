name: Build YaMusic

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:


env:
  QT_VERSION: 6.10.3


jobs:

  # =============================================================
  # Linux x64 — AppImage + tar.gz
  # =============================================================

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Extract version
        run: |
          VERSION="$(sed -nE '/^project\(/,/^\)/s/.*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            file
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true


      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"
      - name: Build
        run: |
          cmake --build build --parallel
      - name: Install
        run: |
          rm -rf dist
          cmake --install build


      - name: Build AppImage
        run: |
          ./scripts/build-appimage.sh

      - name: Package tar.gz
        run: |
          mkdir -p pkg/YaMusic
          cp -a dist/. pkg/YaMusic/
          tar \
            -C pkg \
            -czf "YaMusic-${VERSION}-linux-x86_64.tar.gz" \
            YaMusic

      - name: List artifacts
        run: |
          ls -la YaMusic-*


      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-Linux-x86_64.AppImage
          path: YaMusic-*.AppImage
      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-Linux-x86_64.tar.gz
          path: YaMusic-*.tar.gz


  # =============================================================
  # macOS x64 (Intel)
  # =============================================================

  macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-15-intel

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true


      - name: Install build tools
        run: |
          brew install cmake ninja
      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"
      - name: Build
        run: |
          cmake --build build --parallel
      - name: Install
        run: |
          rm -rf dist
          cmake --install build


      - name: Extract version
        run: |
          VERSION="$(sed -nE '/^project\(/,/^\)/s/.*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Bundle (macdeployqt + qt.conf)
        run: |
          $QT_ROOT_DIR/bin/macdeployqt \
            dist/YaMusic.app \
            -qmldir=qml \
            -always-overwrite
          cat > dist/YaMusic.app/Contents/Resources/qt.conf <<'EOF'
          [Paths]
          Plugins = PlugIns
          QmlImports = qml
          EOF

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "YaMusic" \
            -srcfolder dist/YaMusic.app \
            -ov \
            -format UDZO \
            "YaMusic-${VERSION}-macos-x64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-macOS-x64
          path: YaMusic-*.dmg


  # =============================================================
  # macOS arm64 (Apple Silicon)
  # =============================================================

  macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-15

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true


      - name: Install build tools
        run: |
          brew install cmake ninja
      - name: Configure (arm64)
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: |
          cmake --build build --parallel
      - name: Install
        run: |
          rm -rf dist
          cmake --install build


      - name: Extract version
        run: |
          VERSION="$(sed -nE '/^project\(/,/^\)/s/.*VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -1)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Bundle (macdeployqt + qt.conf)
        run: |
          $QT_ROOT_DIR/bin/macdeployqt \
            dist/YaMusic.app \
            -qmldir=qml \
            -always-overwrite
          cat > dist/YaMusic.app/Contents/Resources/qt.conf <<'EOF'
          [Paths]
          Plugins = PlugIns
          QmlImports = qml
          EOF

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "YaMusic" \
            -srcfolder dist/YaMusic.app \
            -ov \
            -format UDZO \
            "YaMusic-${VERSION}-macos-arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-macOS-arm64
          path: YaMusic-*.dmg


  # =============================================================
  # Windows x64 — portable zip
  # =============================================================

  windows:
    name: Windows x64 (MSVC/SMTC)
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true


      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist"
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
      - name: Install
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }
          cmake --install build


      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          windeployqt `
            --qmldir qml `
            --release `
            --no-translations `
            "$env:GITHUB_WORKSPACE\dist\YaMusic.exe"

          $content = Get-Content CMakeLists.txt -Raw
          $m = [regex]::Match($content, 'project\([^)]*?VERSION\s+([0-9.]+)')
          $version = $m.Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\* `
            -DestinationPath "YaMusic-$env:VERSION-windows-x64-portable.zip"


      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-Windows-x64-portable
          path: YaMusic-${{ env.VERSION }}-windows-x64-portable.zip


  # =============================================================
  # Release (only on tags)
  # =============================================================

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos-x64, macos-arm64, windows]
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YaMusic ${{ github.ref_name }}
          body: |
            ## YaMusic ${{ github.ref_name }}

            Бета-сборка для macOS (Intel и Apple Silicon), Linux и Windows.

            ### Установка

            - **Windows** — `YaMusic-<version>-windows-x64-portable.zip` (portable, без установки)
            - **macOS** — `YaMusic-<version>-macos-x64.dmg` (Intel) или `YaMusic-<version>-macos-arm64.dmg` (Apple Silicon)
            - **Linux** — `YaMusic-<version>-linux-x86_64.AppImage` (запуск: `chmod +x` и запуск) или `YaMusic-<version>-linux-x86_64.tar.gz`

            ### Возможности

            - Новые релизы на главной
            - Сохранённые альбомы
            - Любимые исполнители
            - Автопереход на похожий контент
            - Подсветка текущего трека
            - Тёмная тема (с сохранением)
          draft: false
          prerelease: true
          files: artifacts/**