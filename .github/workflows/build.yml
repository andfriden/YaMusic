ame: Build YaMusic

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


env:
  QT_VERSION: 6.10.3


jobs:

  # =============================================================
  # Linux x64
  # =============================================================

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true


      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"
      - name: Build
        run: |
          cmake --build build --parallel
      - name: Install
        run: |
          rm -rf dist
          cmake --install build
      - name: Package
        run: |
          tar \
            -C dist \
            -czf YaMusic-Linux-x64.tar.gz \
            .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-Linux-x64
          path: YaMusic-Linux-x64.tar.gz


  # =============================================================
  # macOS
  # =============================================================

  macos:
    name: macOS
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true


      - name: Install build tools
        run: |
          brew install cmake ninja
      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"
      - name: Build
        run: |
          cmake --build build --parallel
      - name: Install
        run: |
          rm -rf dist
          cmake --install build
      - name: Create DMG
        run: |
          hdiutil create \
            -volname "YaMusic" \
            -srcfolder dist/YaMusic.app \
            -ov \
            -format UDZO \
            YaMusic-macOS.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-macOS
          path: YaMusic-macOS.dmg


  # =============================================================
  # Windows x64
  # =============================================================

  windows:
    name: Windows x64
    runs-on: windows-2025

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310
          cache: true
          add-tools-to-path: true


      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dist" `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel
      - name: Install
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }
          cmake --install build
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\* `
            -DestinationPath YaMusic-Windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-Windows-x64
          path: YaMusic-Windows-x64.zip
