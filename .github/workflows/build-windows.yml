name: Build Windows

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: "6.9.0"
  VCPKG_TARGET_TRIPLET: x64-windows
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-2022

    # contents: write нужен только для прикрепления установщика к релизу по тегу.
    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Check build tools
        run: |
          $ErrorActionPreference = "Stop"

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw "CMake is unavailable."
          }

          ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja is unavailable."
          }

          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (!(Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg.exe not found: $vcpkg"
          }

      - name: Extract version
        run: |
          $ErrorActionPreference = "Stop"

          $content = Get-Content -LiteralPath CMakeLists.txt -Raw

          $match = [regex]::Match(
            $content,
            '(?is)\bproject\s*\([^)]*?\bVERSION\s+([0-9]+(?:\.[0-9]+){1,3})(?=\s|\))'
          )

          if (!$match.Success) {
            throw "Project VERSION not found in CMakeLists.txt."
          }

          $version = $match.Groups[1].Value

          "VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "YaMusic version: $version"

      - name: Install TagLib in classic mode
        if: ${{ hashFiles('vcpkg.json') == '' }}
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"

          & $vcpkg install "taglib:$env:VCPKG_TARGET_TRIPLET"

          if ($LASTEXITCODE -ne 0) {
            throw "TagLib installation failed."
          }

      - name: Configure
        run: |
          $ErrorActionPreference = "Stop"

          $toolchain = Join-Path `
            $env:VCPKG_INSTALLATION_ROOT `
            "scripts/buildsystems/vcpkg.cmake"

          if (Test-Path -LiteralPath "vcpkg.json") {
            # Dependencies are installed by the vcpkg toolchain
            # during CMake configuration.
            $installedDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build/vcpkg_installed"
          } else {
            $installedDir = Join-Path `
              $env:VCPKG_INSTALLATION_ROOT `
              "installed"
          }

          # Forward slashes avoid path-escaping issues in CMake.
          $toolchain = $toolchain.Replace('\', '/')
          $installedDir = $installedDir.Replace('\', '/')
          $installPrefix = (
            Join-Path $env:GITHUB_WORKSPACE "dist"
          ).Replace('\', '/')

          "YAMUSIC_VCPKG_INSTALLED_DIR=$installedDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET",
            "-DVCPKG_INSTALLED_DIR=$installedDir",
            "-DCMAKE_INSTALL_PREFIX=$installPrefix",
            "-DCMAKE_INSTALL_BINDIR=bin"
          )

          cmake @cmakeArgs

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed."
          }

      - name: Install and deploy Qt
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path -LiteralPath "dist") {
            Remove-Item -LiteralPath "dist" -Recurse -Force
          }

          cmake --install build --config Release

          if ($LASTEXITCODE -ne 0) {
            throw "Installation or Qt deployment failed."
          }

          if (!(Test-Path -LiteralPath "dist/bin/YaMusic.exe")) {
            throw "dist/bin/YaMusic.exe was not installed."
          }

      - name: Copy vcpkg Release runtime
        run: |
          $ErrorActionPreference = "Stop"

          $runtimeDir = Join-Path `
            $env:YAMUSIC_VCPKG_INSTALLED_DIR `
            "$env:VCPKG_TARGET_TRIPLET/bin"

          if (!(Test-Path -LiteralPath $runtimeDir)) {
            throw "vcpkg Release runtime directory not found: $runtimeDir"
          }

          # Copy only Release DLLs. Never copy debug/bin.
          # Copying the whole Release DLL set also covers
          # dynamic dependencies of TagLib.
          $dlls = @(
            Get-ChildItem -LiteralPath $runtimeDir -Filter "*.dll" -File
          )

          if ($dlls.Count -eq 0) {
            throw "No runtime DLLs found in: $runtimeDir"
          }

          foreach ($dll in $dlls) {
            Copy-Item `
              -LiteralPath $dll.FullName `
              -Destination "dist/bin" `
              -Force
          }

      - name: Trim Qt translations
        run: |
          $ErrorActionPreference = "Stop"

          $keep = @("qtbase_ru", "qt_ru")

          # Qt deployment layouts can differ, so do not assume
          # translations are directly under dist.
          $translationDirs = @(
            Get-ChildItem -LiteralPath "dist" -Directory -Recurse |
              Where-Object { $_.Name -eq "translations" }
          )

          foreach ($directory in $translationDirs) {
            Get-ChildItem `
              -LiteralPath $directory.FullName `
              -Filter "*.qm" `
              -File |
              Where-Object {
                $_.BaseName -match '^qt' -and
                $_.BaseName -notin $keep
              } |
              Remove-Item -Force
          }

      - name: Verify deployment
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "dist/bin/YaMusic.exe",
            "dist/bin/Qt6Core.dll",
            "dist/bin/Qt6Gui.dll",
            "dist/bin/Qt6Qml.dll",
            "dist/bin/Qt6Quick.dll",
            "dist/bin/Qt6Network.dll",
            "dist/bin/Qt6Multimedia.dll"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required deployment file is missing: $file"
            }

            if ((Get-Item -LiteralPath $file).Length -eq 0) {
              throw "Required deployment file is empty: $file"
            }
          }

          # Плагин платформы Qt кладёт либо рядом с exe, либо в <prefix>/plugins.
          $qwindows = Get-ChildItem `
            -LiteralPath "dist" `
            -Filter "qwindows.dll" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (!$qwindows) {
            throw "Qt platform plugin qwindows.dll was not deployed."
          }

          Write-Host "Platform plugin: $($qwindows.FullName)"

          Get-ChildItem -LiteralPath "dist" -Directory |
            Select-Object FullName

          Get-ChildItem -LiteralPath "dist" -Recurse -File |
            Measure-Object -Property Length -Sum |
            Select-Object Count, Sum

      - name: Build NSIS installer
        run: |
          $ErrorActionPreference = "Stop"

          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (!$makensis) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (!(Test-Path -LiteralPath $makensis)) {
            throw "makensis not found."
          }

          $setupName = "YaMusic-$env:VERSION-windows-x64-setup.exe"
          $setupPath = Join-Path $env:GITHUB_WORKSPACE $setupName
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"

          & $makensis `
            "/DVERSION=$env:VERSION" `
            "/DINSTALL_DIR=$distDir" `
            "/DOUTFILE=$setupPath" `
            "packaging/windows/installer.nsi"

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer build failed."
          }

          if (!(Test-Path -LiteralPath $setupPath)) {
            throw "Installer was not created: $setupPath"
          }

          "SETUP_NAME=$setupName" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-Item -LiteralPath $setupPath |
            Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-${{ env.VERSION }}-windows-x64-portable
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: YaMusic-${{ env.VERSION }}-windows-x64-setup
          path: ${{ env.SETUP_NAME }}
          if-no-files-found: error
          retention-days: 14

      # Релиз создаёт workflow "Build YaMusic" после сборки Linux и macOS.
      # Здесь только дожидаемся его появления, чтобы установщик лёг в тот же
      # релиз и не возникало гонки за создание.
      - name: Wait for release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $found = $false
          for ($i = 0; $i -lt 30; $i++) {
            gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) {
              $found = $true
              break
            }
            Start-Sleep -Seconds 30
          }

          if (!$found) {
            Write-Host "::warning::Release $env:GITHUB_REF_NAME not found in time; installer stays in workflow artifacts."
            "RELEASE_READY=false" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          "RELEASE_READY=true" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish installer to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.RELEASE_READY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.SETUP_NAME }}
